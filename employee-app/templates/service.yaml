apiVersion: v1 
kind: Service 
metadata:
  name: {{ include "employeeapp.name" . }}-service
  namespace: {{ include "employeeapp.namespace" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
   {{- include "employeeapp.selectorLabels" . | nindent 4}}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  